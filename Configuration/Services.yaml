services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiMember\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'

  Maispace\MaiMember\Controller\MemberController:
    public: true

  Maispace\MaiMember\Controller\ApplicationController:
    public: true

  Maispace\MaiMember\Controller\Backend\MemberBackendController:
    public: true

  Maispace\MaiMember\Service\ApplicationService:
    public: true

  Maispace\MaiMember\Service\MemberMailer:
    public: true

  # DataHandler instantiates hooks via GeneralUtility::makeInstance() — must be public for DI
  Maispace\MaiMember\Hook\MemberCacheInvalidationHook:
    public: true

  Maispace\MaiMember\Indexer\MemberIndexer:
    tags:
      - name: 'maispace.search.indexer'
      - name: 'maispace.search.result_formatter'
